services:
  namenode:
    image: apache/hadoop:3.5.0
    hostname: namenode
    command: [hdfs, namenode]
    ports:
      - 9870:9870
    env_file: ./config
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hdfs/name
    volumes:
      - ./workspace:/workspace

  datanode:
    image: apache/hadoop:3.5.0
    command: [hdfs, datanode]
    env_file: ./config
    deploy:
      replicas: 4
